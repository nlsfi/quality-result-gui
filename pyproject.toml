[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quality-result-gui"
dynamic = ["version"]
description = "QGIS plugin for visualizing quality check results."
readme = { file = "README.md", content-type = "text/markdown" }
license = { text = "GNU GPL v3.0" }
authors = [
    { name = "National Land Survey of Finland", email = "os@nls.fi" },
]
keywords = ["qgis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
requires-python = ">=3.12"
dependencies = [
    "qgis_plugin_tools",
]

[project.urls]
Homepage = "https://github.com/nlsfi/quality-result-gui"
Changelog = "https://github.com/nlsfi/quality-result-gui/blob/main/CHANGELOG.md"

[project.entry-points.qgis_plugin_dev_tools]
quality_result_gui_plugin = "quality_result_gui_plugin"

[tool.uv]
default-groups = ["dev", "test", "lint"]

[dependency-groups]
dev = [
    "qgis-plugin-dev-tools",
]
test = [
    "pytest",
    "pytest-qt",
    "pytest-mock",
    "pytest-cov",
    "pytest-qgis",
    "pyqt5-stubs",
    "pytest-timeout",
    "pytest-order",
    "pytest-dotenv",
    # lock here since 1.4.1 has no binaries
    "atomicwrites==1.4.0",
]
lint = [
    "pre-commit",
    "mypy",
    "black",
    "ruff",
    "flake8",
    "flake8-pyproject",
    "flake8-qgis",
    "flake8-spellcheck",
]

[tool.setuptools.dynamic]
version = { attr = "quality_result_gui.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
quality_result_gui = [
    "py.typed",
    "**/*.svg",
    "**/*.ui",
    "**/*.ts",
    "**/*.qm",
]

quality_result_gui_plugin = [
    "metadata.txt",
    "py.typed",
    "**/*.ui",
    "**/*.json",
    "**/*.svg",
    "**/*.ts",
    "**/*.qm",
]


[tool.ruff]
ignore = [
    "ANN101", # Missing type annotation for self in method
    ]
line-length = 88

# List of all rules https://docs.astral.sh/ruff/rules/
select = [
    "ANN", # flake8-annotations
    "B", # flake8-bugbear
    "C", # flake8-comprehensions
    "C90", # flake8, mccabe
    "E", # flake8, pycodestyle
    "F", # flake8, Pyflakes
    "I", # isort
    "INP", # flake8-no-pep420
    "N", # pep8-naming
    "PIE", # flake8-pie
    "PGH", # pygrep-hooks
    "PL", # pylint
    "PT", # flake8-pytest-style
    "RUF", # Ruff-specific rules
    "SIM", # flake8-simplify
    "T", # flake8-print
    "ICN", # flake8-import-conventions
    "TCH", # flake8-type-checking
    "TID", # flake8-tidy-imports
    "W", # flake8, pycodestyle
    "UP", # pyupgrade
    ]

# Avoiding flagging (and removing) `SC200` from any `# noqa`
# directives, despite Ruff's lack of support for `flake8-spellcheck`.
external = ["SC200"]

target-version = "py39"

[tool.ruff.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.per-file-ignores]
"test*" = [
    "INP001",
    "ANN201",
    "ANN202",
    "ANN401",
    "E501",
    "PLR2004", # Magic value used in comparison, consider replacing {value} with a constant variable
    "PLR0913", # Too many arguments to function call (len(args) > 5)
    ]
"tools*" = [
    "T201",
    "N999"
]


[tool.flake8]
max-line-length = 88
spellcheck-targets = "names"
dictionaries = "en_US,python,technical"
extend-ignore = [
    "E203",  # whitespace before ':'
    "E501",  # line length (checked by ruff now, possible mismatches)
]
per-file-ignores = [
    "test/*:INP001,SC200,QGS105",
]

[tool.mypy]
follow_imports = "normal"
show_column_numbers = true

[tool.pytest.ini_options]
minversion = "6.0"

[tool.qgis_plugin_dev_tools]
plugin_package_name = "quality_result_gui_plugin"
runtime_requires = [
    "qgis_plugin_tools",
    "quality-result-gui"
]
version_number_source = "distribution"
