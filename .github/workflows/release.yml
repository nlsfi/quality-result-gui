name: Release

on:
  release:
    types: [released]

jobs:
  pypi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
      - uses: svenstaro/upload-release-action@2.3.0
        with:
          file: dist/*
          file_glob: true

  qgis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
      # Use --no-editable so .dist-info is written to site-packages instead of .egg-info
      - run: uv sync --no-editable
      - run: uv run qgis-plugin-dev-tools build
      # no qgis repo publish yet for the dummy plugin gui
      # - run: uv run qgis-plugin-dev-tools publish dist/*.zip
      #   env:
      #     QPDT_PUBLISH_USERNAME: ${{ secrets.QGIS_REPO_USERNAME }}
      #     QPDT_PUBLISH_PASSWORD: ${{ secrets.QGIS_REPO_PASSWORD }}
      - uses: svenstaro/upload-release-action@2.3.0
        with:
          file: dist/*
          file_glob: true
